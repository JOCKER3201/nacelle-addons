[package]
name = "nacelle-widget-appgrid"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop application launcher, as a compiled widget"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# fork / setsid / execvp / waitpid, for handing an application over to
# init instead of keeping it as a child of the desktop (src/desktop.rs).
# The same crate the toolkit already builds on every unix, so this adds
# nothing new to the tree.
libc = "0.2"

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []

# ------------------------------------------------------------------------
# STANDALONE BUILD — delete BOTH tables below the moment `plugins/appgrid`
# is added to nacelle-addons/Cargo.toml's `workspace.members`: the
# workspace supplies the same patch itself, and two workspace roots in
# one tree is a hard error. Until then these are what let `cargo build`
# and `cargo test` run in this directory while the crate is not yet a
# member of anything.
# ------------------------------------------------------------------------
