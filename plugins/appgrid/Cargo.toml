[package]
name = "nacelle-widget-appgrid"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop application launcher, as a compiled widget"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# The launcher's shared half — the XDG scan, the categories, the tile
# grid, the index and the selection — which the categories widget
# is built out of too. It exports NO attach symbol, so linking it here
# leaves this library with exactly one entry point, which is what lets
# both launcher widgets be shipped as files.
nacelle-launcher-core = { path = "../launcher-core" }

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []
