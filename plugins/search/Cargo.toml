[package]
name = "nacelle-widget-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop search panel, as a compiled widget"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# The launcher's shared half, for the ONE thing this panel shares with
# the application grid: the XDG scan that says what is installed, and the
# double fork that hands a chosen application over to init. A second copy
# of either would be a second launcher — the whole reason that crate
# exists. Nothing else of it is linked: the tile grid, the categories and
# the alphabetical index are a GRID's, and this panel draws rows.
nacelle-launcher-core = { path = "../launcher-core" }

# The derive for this panel's own settings type (src/config.rs). The
# document is parsed by `nacelle::settings::load`, so `ron` is not a
# dependency here — only the type it deserialises into is this crate's.
# Costs no new package: serde is already in the tree, and its derive
# brings proc-macro2, quote and syn, all of which rhai_codegen already
# locked.
serde = { version = "1", features = ["derive"] }

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []
