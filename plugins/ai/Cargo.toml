[package]
name = "nacelle-widget-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop AI panel, as a compiled widget — inert until nacelle-ai answers"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# NO nacelle-launcher-core here, and that is the point rather than an
# omission. That crate is the LAUNCHER's shared half — the XDG scan, the
# categories, the tile grid, the alphabetical index — and this panel
# draws none of them: one wrapped message, from the theme's own
# [emptystate]. Linking it would put a directory walker inside a widget
# whose whole job is to cost nothing until nacelle-ai exists. The three
# small theme helpers this file does keep are the ones every non-launcher
# widget here keeps (control, filesystem, shell each have their own).

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []

# LOCAL BUILD PATCH — this crate is a member of the nacelle-addons
# workspace, and cargo honours `[patch]` at the workspace ROOT only ("patch
# for the non root package will be ignored"). The block that builds this
# tree against the libnacelle checkout beside it therefore lives in
# ../../Cargo.toml, under that same marker, and a second copy here would
# be a warning on every build and no effect at all.
