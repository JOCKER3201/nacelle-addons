[package]
name = "nacelle-widget-appcats"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop application menu by category, as a compiled widget"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# The launcher grid, as a library: this widget shows the SAME
# applications, found by the SAME XDG scanner (appgrid::desktop), drawn
# as the SAME tiles (appgrid::tile), and started by the SAME detached
# launch. Nothing about a desktop entry is parsed twice in this tree.
# `default-features = false` drops appgrid's dlopen attach symbol —
# two plugins exporting `nacelle_plugin_attach` from one process is
# exactly the collision that feature exists to prevent.
nacelle-widget-appgrid = { path = "../appgrid", default-features = false }

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []

# ------------------------------------------------------------------------
# STANDALONE BUILD — delete BOTH tables below the moment `plugins/appcats`
# is added to nacelle-addons/Cargo.toml's `workspace.members`: the
# workspace supplies the same patch itself, and two workspace roots in
# one tree is a hard error. Until then these are what let `cargo build`
# and `cargo test` run in this directory while the crate is not yet a
# member of anything.
#
# `plugins/appgrid` stays a bare path dependency and is NOT listed as a
# member here: its own manifest carries the identical standalone pair,
# and one workspace cannot hold two roots. A path dependency that is its
# own root is fine — cargo simply builds it — but the patch above is the
# one that counts for the whole graph, appgrid's being ignored while it
# is not the root. Adding both crates to nacelle-addons' `members`
# retires this block and appgrid's together.
# ------------------------------------------------------------------------
[workspace]

[patch."https://github.com/JOCKER3201/libnacelle"]
libnacelle = { path = "../../../libnacelle" }
