[package]
name = "nacelle-widget-appcats"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The nacelle-desktop application menu by category, as a compiled widget"
license = "MIT"

[lib]
# A widget plugin is a C-callable dynamic library: the host loads it with
# dlopen and talks to it through plain function pointers.
crate-type = ["cdylib", "rlib"]

[dependencies]
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# The launcher's shared half: this widget groups the SAME applications,
# found by the SAME XDG scanner (`desktop`), read into groups by the
# SAME categories module (`cats`), and drawn with the SAME chamfer,
# ladder and scrollbar (`tile`). Nothing about a desktop entry is
# parsed twice in this tree.
#
# It is also how the two widgets reach each other: clicking a row here
# writes `selection`, and the grid reads it — which works only while a
# host LINKS both widgets into one binary. See the head of
# launcher-core/src/selection.rs for why that is a deliberate stopgap,
# what a `.so` build of each loses, and what replaces it.
#
# The crate this depends on exports no attach symbol of its own, so
# this library has exactly one — which is what the widget used to be
# unable to say while it depended on the grid's crate directly.
nacelle-launcher-core = { path = "../launcher-core" }

[features]
# The dlopen attach symbol. On for the shipped .so; a host that links
# this crate statically turns it off, so several plugins' identical
# attach symbols cannot collide inside one binary.
default = ["dyn"]
dyn = []
