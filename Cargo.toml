# The compiled widgets, as one workspace.
#
# A widget is a FILE. Every widget in this repository is either a Rhai
# script under scripts/ or one of the widget crates below, each
# built into its own .so and installed beside its .meta, exactly as a
# third-party compiled addon would be. Where a widget's controls are is
# the widget's own business: the application asks through the toolkit's
# widget interface (`pointer`) instead of holding a copy of anybody's
# geometry.
#
# Two crates are NOT widgets: plugins/launcher-core, the launcher's
# shared half, which both launcher widgets link and neither owns; and
# plugins/ai-client, the nacelle-ai daemon protocol's client half, which
# the AI widgets link to speak to the daemon. Neither exports an attach
# symbol and neither installs anything, so no .so in this tree ever
# carries two entry points.
#
# Every widget crate also builds with its `dyn` feature off, which
# drops the dlopen attach symbol and leaves the crate linkable — the
# path nacelle-desktop takes for a core that no file can uninstall.
# The two builds are the same code; only the entry point differs.

[workspace]
resolver = "2"
members = [
    "plugins/ai-client",
    "plugins/aichat",
    "plugins/ailoop",
    "plugins/aiphoto",
    "plugins/aisort",
    "plugins/appcats",
    "plugins/appgrid",
    "plugins/control",
    "plugins/filesystem",
    "plugins/keyboard",
    "plugins/launcher-core",
    "plugins/search",
    "plugins/shell",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
